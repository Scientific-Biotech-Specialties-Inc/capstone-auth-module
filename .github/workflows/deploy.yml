name: deploy-auth-module

# Builds the capstone-auth-module images (proxy, api, web) and deploys them to
# the existing Azure Container Apps.
#
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC).
#
# Security gates (php2shell CVE-2026-109618 / CVE-2026-109619 remediation):
#   1. composer audit must pass before any image is built.
#   2. The built auth-api image must run PHP >= MIN_PHP_VERSION.
#   3. Trivy must report no CRITICAL vulnerabilities in auth-api.
# Container apps are only rolled after all gates pass.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  RG: rg-capstone
  REGISTRY_ORG: ghcr.io/scientific-biotech-specialties-inc
  IMAGE_TAG: ${{ github.sha }}
  MIN_PHP_VERSION: 8.3.36

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (audit only)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer audit
        working-directory: ./auth-service
        continue-on-error: true
        run: composer audit --locked --no-interaction

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    concurrency: { group: azure-auth, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth-api
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/auth-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_ORG }}/auth-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-web
        uses: docker/build-push-action@v5
        with:
          context: ./web-interface
          file: ./web-interface/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/auth-web:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_ORG }}/auth-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-proxy
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/auth-proxy:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_ORG }}/auth-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gate - PHP runtime version
        run: |
          IMAGE=${{ env.REGISTRY_ORG }}/auth-api:${{ env.IMAGE_TAG }}
          docker pull "$IMAGE"
          docker run --rm --entrypoint php "$IMAGE" -v
          docker run --rm -e MIN_PHP_VERSION="$MIN_PHP_VERSION" --entrypoint php "$IMAGE" -r \
            'exit(version_compare(PHP_VERSION, getenv("MIN_PHP_VERSION"), "<") ? 1 : 0);'

      - name: Gate - Trivy scan auth-api
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY_ORG }}/auth-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll auth-api
        run: az containerapp update -n auth-api -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/auth-api:$IMAGE_TAG

      - name: Roll auth-worker
        run: az containerapp update -n auth-worker -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/auth-api:$IMAGE_TAG

      - name: Roll auth-web
        run: az containerapp update -n auth-web -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/auth-web:$IMAGE_TAG

      - name: Roll auth-proxy
        run: az containerapp update -n auth-proxy -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/auth-proxy:$IMAGE_TAG
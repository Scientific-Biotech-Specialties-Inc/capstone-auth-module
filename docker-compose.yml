services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    volumes:
      - ./auth-service:/var/www/html
      - auth-service-vendor:/var/www/html/vendor
    environment:
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - PHP_CLI_SERVER_WORKERS=4
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - VENDOR_MANAGEMENT_URL=${VENDOR_MANAGEMENT_URL}
      - INTERNAL_ENCRYPTION_KEY=${INTERNAL_ENCRYPTION_KEY}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_SCHEME=${MAIL_SCHEME}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - EMAIL_NOTIFICATIONS_PROVIDER=${EMAIL_NOTIFICATIONS_PROVIDER}
      - BREVO_BASE_URL=${BREVO_BASE_URL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_WEBHOOK_SECRET=${BREVO_WEBHOOK_SECRET}
      - BREVO_WEBHOOK_SECRET_HEADER=${BREVO_WEBHOOK_SECRET_HEADER}
      - BREVO_TEMPLATE_WELCOME_TEMP_PASSWORD=${BREVO_TEMPLATE_WELCOME_TEMP_PASSWORD}
      - BREVO_TEMPLATE_PASSWORD_RESET=${BREVO_TEMPLATE_PASSWORD_RESET}
      - BREVO_TEMPLATE_EMAIL_VERIFICATION=${BREVO_TEMPLATE_EMAIL_VERIFICATION}
      - BREVO_TEMPLATE_PASSWORD_CHANGED_CONFIRMATION=${BREVO_TEMPLATE_PASSWORD_CHANGED_CONFIRMATION}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    networks:
      - shared-capstone-network

  queue-worker:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: queue-worker
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./auth-service:/var/www/html
      - auth-service-vendor:/var/www/html/vendor
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - SKIP_MIGRATIONS=true
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_SCHEME=${MAIL_SCHEME}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - EMAIL_NOTIFICATIONS_PROVIDER=${EMAIL_NOTIFICATIONS_PROVIDER}
      - BREVO_BASE_URL=${BREVO_BASE_URL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_WEBHOOK_SECRET=${BREVO_WEBHOOK_SECRET}
      - BREVO_WEBHOOK_SECRET_HEADER=${BREVO_WEBHOOK_SECRET_HEADER}
      - BREVO_TEMPLATE_WELCOME_TEMP_PASSWORD=${BREVO_TEMPLATE_WELCOME_TEMP_PASSWORD}
      - BREVO_TEMPLATE_PASSWORD_RESET=${BREVO_TEMPLATE_PASSWORD_RESET}
      - BREVO_TEMPLATE_EMAIL_VERIFICATION=${BREVO_TEMPLATE_EMAIL_VERIFICATION}
      - BREVO_TEMPLATE_PASSWORD_CHANGED_CONFIRMATION=${BREVO_TEMPLATE_PASSWORD_CHANGED_CONFIRMATION}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - VENDOR_MANAGEMENT_URL=${VENDOR_MANAGEMENT_URL}
      - INTERNAL_ENCRYPTION_KEY=${INTERNAL_ENCRYPTION_KEY}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - shared-capstone-network

  web-interface:
    build:
      context: ./web-interface
      dockerfile: Dockerfile
    container_name: web-interface
    expose:
      - "5000"
    volumes:
      - ./web-interface:/app
      - web-interface-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://auth-service:8000
      - VITE_INTERNAL_ENCRYPTION_KEY=${INTERNAL_ENCRYPTION_KEY}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - shared-capstone-network

  nginx-proxy:
    image: nginx:alpine
    container_name: shared-nginx-proxy
    ports:
      - "80:5173"
      - "5173:5173"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      web-interface:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - shared-capstone-network

  auth-db:
    image: mysql:8.0
    container_name: mysql-db
    command: --skip-name-resolve
    ports:
      - "33066:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-capstone-network

  auth-redis:
    image: redis:alpine
    container_name: auth-redis
    command: redis-server --appendonly yes
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shared-capstone-network

networks:
  shared-capstone-network:
    external: true

volumes:
  auth-service-vendor:
  web-interface-node-modules:
  mysql-data:
  auth-redis-data:


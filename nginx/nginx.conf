server {
    listen 5173;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=30s;

    # Auth module web interface at root
    location / {
        set $upstream_web http://web-interface:5000;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Auth API gateway
    location /api/ {
        # php2shell hardening (auth API only): JSON-only API, so cap body size
        # and reject multipart. Subsystem routes match longer prefixes first.
        client_max_body_size 2m;
        if ($content_type ~* "multipart/form-data") {
            return 415;
        }

        set $auth_header $http_authorization;
        if ($cookie_access_token) {
            set $auth_header "Bearer $cookie_access_token";
        }
        proxy_set_header Authorization $auth_header;
        proxy_set_header Cookie $http_cookie;
        set $upstream_auth_api http://auth-service:8000;
        proxy_pass $upstream_auth_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
    }


    # PRS API gateway
    location /api/prs/ {
        set $auth_header $http_authorization;
        if ($cookie_access_token) {
            set $auth_header "Bearer $cookie_access_token";
        }
        proxy_set_header Authorization $auth_header;
        set $upstream_prs_api http://prs_api:8000;
        rewrite ^/api/prs/(.*)$ /api/$1 break;
        proxy_pass $upstream_prs_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
    }
    # SERMS API gateway
    location /api/serms/ {
        set $auth_header $http_authorization;
        if ($cookie_access_token) {
            set $auth_header "Bearer $cookie_access_token";
        }
        proxy_set_header Authorization $auth_header;
        proxy_set_header Cookie $http_cookie;
        set $upstream_serms_api http://serms_api:8000;
        rewrite ^/api/serms/(.*)$ /api/$1 break;
        proxy_pass $upstream_serms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
    }

    # PRS frontend at /prs/
    location /prs/ {
        set $upstream_prs http://prs_web:5003;
        proxy_pass $upstream_prs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # CMS frontend at /cms/ (local dev: cms-web:5000+; prod overlay uses cms-nginx-prod:80)
    location /cms/ {
        set $upstream_crms http://cms-web:5001;
        proxy_pass $upstream_crms;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SERMS frontend at /serms/
    location /serms/ {
        set $upstream_serms_web http://serms_web:5002;
        proxy_pass $upstream_serms_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Ticketing API gateway (Single entrypoint for Ticketing System)
    location /api/ticketing/ {
        set $auth_header $http_authorization;
        if ($cookie_access_token) {
            set $auth_header "Bearer $cookie_access_token";
        }
        proxy_set_header Authorization $auth_header;
        proxy_set_header Cookie $http_cookie;
        set $upstream_ticketing_gateway http://ticketing-gateway:80;
        proxy_pass $upstream_ticketing_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
    }

    # Ticketing frontend at /ticketing/
    location /ticketing/ {
        set $upstream_ticketing http://ticketing_web:5005;
        proxy_pass $upstream_ticketing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Ticketing attachments storage
    location /storage/ {
        set $upstream_ticketing_gateway http://ticketing-gateway:80;
        proxy_pass $upstream_ticketing_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # CMS Generic API Gateway
    location ~ ^/api/(vendor|contract|search|notification|ai|analytics)(?:/(.*))?$ {
        set $service $1;
        set $remaining $2;

        set $service_host "";
        if ($service = "vendor") {
            set $service_host "vendor-management";
        }
        if ($service = "contract") {
            set $service_host "contract-management";
        }
        if ($service = "search") {
            set $service_host "search";
        }
        if ($service = "notification") {
            set $service_host "notification";
        }
        if ($service = "ai") {
            set $service_host "ai-service";
        }
        if ($service = "analytics") {
            set $service_host "analytics-service";
        }

        set $auth_header $http_authorization;
        if ($cookie_access_token) {
            set $auth_header "Bearer $cookie_access_token";
        }
        proxy_set_header Authorization $auth_header;
        proxy_set_header Cookie $http_cookie;

        set $target_url http://$service_host:8000/api/$remaining$is_args$args;
        proxy_pass $target_url;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
    }
}
